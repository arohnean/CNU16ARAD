<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CN U16 ARAD FEMININ</title>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #848d97; --accent: #238636; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 10px; text-align: center; }
        .setup-section { background: var(--panel); padding: 20px; border-radius: 12px; max-width: 500px; margin: 20px auto; border: 1px solid var(--border); }
        .team-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .team-inputs input { background: var(--bg); color: var(--text); padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
        .btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .bracket-container { display: flex; flex-direction: column; gap: 20px; padding: 10px; overflow-x: auto; }
        .bracket-title { background: #21262d; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; border: 1px solid var(--border); margin-top: 15px; text-transform: uppercase; }
        .bracket-sections-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; min-width: max-content; margin-top: 15px; }
        .bracket-section { background: var(--panel); padding: 15px; border-radius: 12px; border: 1px solid var(--border); display: flex; gap: 20px; }
        .round { display: flex; flex-direction: column; justify-content: space-around; min-width: 220px; }
        .round-title { font-size: 12px; color: var(--muted); margin-bottom: 5px; border-bottom: 1px solid var(--border); padding-bottom: 4px; font-weight: bold; }
        .matchup { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin: 10px 0; text-align: left; }
        .matchup.active { border-color: #58a6ff; }
        .match-title { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: bold; }
        .slot { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid #21262d; }
        .slot:last-of-type { border-bottom: none; }
        .slot span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .slot input { background: var(--panel); border: 1px solid var(--border); color: var(--text); width: 40px; text-align: center; border-radius: 4px; font-weight: bold; }
        .matchup .btn-trimite { width: 100%; padding: 6px; font-size: 12px; margin-top: 8px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>CN U16 ARAD 2026 FEMININ</h1>
    <div class="setup-section" id="setup">
        <h3>Configurare Echipe (12 Echipe)</h3>
        <p style="font-size:12px;color:var(--muted);margin-bottom:15px">Primele 4 au BYE în primul tur.</p>
        <div class="team-inputs" id="inputs-container">
            <input type="text" id="t1" value="TISEANU / BUGI"><input type="text" id="t2" value="BELEJAN / CHERECHES">
            <input type="text" id="t3" value="CARSTEA / VASILESCU"><input type="text" id="t4" value="PRESECAN / SABAU">
            <input type="text" id="t5" value="IUGA / PRIPON"><input type="text" id="t6" value="ROMAN / CHINDRIS">
            <input type="text" id="t7" value="BLAJ CIOCOIU / SZATMARY"><input type="text" id="t8" value="SERTEA / BRENCIU">
            <input type="text" id="t9" value="CRISAN / MORUZ"><input type="text" id="t10" value="BALTA / MOTICA">
            <input type="text" id="t11" value="POP / CIMPAN"><input type="text" id="t12" value="ILCA / ROSTAS">
        </div>
        <button class="btn" onclick="genereazaTurneu()">Creează și Salvează Tabloul</button>
    </div>
    <div class="bracket-container" id="bracket" style="display: none;">
        <button class="btn" style="background:#30363d; max-width: 200px; margin-bottom: 10px;" onclick="reseteazaTot()">🔄 Modifică Echipele</button>
        <div class="bracket-sections-wrapper">
            <div>
                <div class="bracket-title">🌿 RUTA CÂȘTIGĂTORILOR</div>
                <div class="bracket-section">
                    <div class="round"><div class="round-title">Turul 1</div><div id="w-r1"></div></div>
                    <div class="round"><div class="round-title">Sferturi</div><div id="w-r2"></div></div>
                    <div class="round"><div class="round-title">Semifinale</div><div id="w-r3"></div></div>
                    <div class="round"><div class="round-title">Finală</div><div id="w-r4"></div></div>
                </div>
            </div>
            <div>
                <div class="bracket-title">🍂 RUTA PIERZĂTORILOR</div>
                <div class="bracket-section">
                    <div class="round"><div class="round-title">Pierzători T1</div><div id="l-r1"></div></div>
                    <div class="round"><div class="round-title">Pierzători T2</div><div id="l-r2"></div></div>
                    <div class="round"><div class="round-title">Pierzători T3</div><div id="l-r3"></div></div>
                    <div class="round"><div class="round-title">Pierzători T4</div><div id="l-r4"></div></div>
                    <div class="round"><div class="round-title">Finală Pierzători</div><div id="l-r5"></div></div>
                </div>
            </div>
        </div>
        <div class="bracket-title">🏆 ETAPA FINALĂ</div>
        <div class="bracket-section" style="justify-content: center;"><div class="round"><div class="round-title">Marea Finală</div><div id="grand-final"></div></div></div>
    </div>
    <script>
        let echipe = [], meciuri = {};
        function genereazaTurneu() {
            echipe = [];
            for (let i = 1; i <= 12; i++) echipe.push(document.getElementById("t" + i).value || ("Echipa " + i));
            meciuri = {
                'W1': { t1: echipe[4], t2: echipe[11], s1: null, s2: null, nxt: 'W5_t1', lsr: 'L1_t1', st: 'ready' },
                'W2': { t1: echipe[7], t2: echipe[8], s1: null, s2: null, nxt: 'W6_t1', lsr: 'L1_t2', st: 'ready' },
                'W3': { t1: echipe[5], t2: echipe[10], s1: null, s2: null, nxt: 'W7_t1', lsr: 'L2_t1', st: 'ready' },
                'W4': { t1: echipe[6], t2: echipe[9], s1: null, s2: null, nxt: 'W8_t1', lsr: 'L2_t2', st: 'ready' },
                'W5': { t1: '', t2: echipe[0], s1: null, s2: null, nxt: 'W9_t1', lsr: 'L3_t2', st: 'wait' },
                'W6': { t1: '', t2: echipe[3], s1: null, s2: null, nxt: 'W9_t2', lsr: 'L4_t2', st: 'wait' },
                'W7': { t1: '', t2: echipe[1], s1: null, s2: null, nxt: 'W10_t1', lsr: 'L5_t2', st: 'wait' },
                'W8': { t1: '', t2: echipe[2], s1: null, s2: null, nxt: 'W10_t2', lsr: 'L6_t2', st: 'wait' },
                'W9': { t1: '', t2: '', s1: null, s2: null, nxt: 'W11_t1', lsr: 'L7_t2', st: 'wait' },
                'W10': { t1: '', t2: '', s1: null, s2: null, nxt: 'W11_t2', lsr: 'L8_t2', st: 'wait' },
                'W11': { t1: '', t2: '', s1: null, s2: null, nxt: 'F1_t1', lsr: 'L9_t2', st: 'wait' },
                'L1': { t1: '', t2: '', s1: null, s2: null, nxt: 'L3_t1', lbl1: 'Pierzătoare M1', lbl2: 'Pierzătoare M2', st: 'wait' },
                'L2': { t1: '', t2: '', s1: null, s2: null, nxt: 'L4_t1', lbl1: 'Pierzătoare M3', lbl2: 'Pierzătoare M4', st: 'wait' },
                'L3': { t1: '', t2: '', s1: null, s2: null, nxt: 'L5_t1', lbl2: 'Pierzătoare M5', st: 'wait' },
                'L4': { t1: '', t2: '', s1: null, s2: null, nxt: 'L6_t1', lbl2: 'Pierzătoare M6', st: 'wait' },
                'L5': { t1: '', t2: '', s1: null, s2: null, nxt: 'L7_t1', lbl2: 'Pierzătoare M7', st: 'wait' },
                'L6': { t1: '', t2: '', s1: null, s2: null, nxt: 'L8_t1', lbl2: 'Pierzătoare M8', st: 'wait' },
                'L7': { t1: '', t2: '', s1: null, s2: null, nxt: 'L9_t1', lbl2: 'Pierzătoare M9', st: 'wait' },
                'L8': { t1: '', t2: '', s1: null, s2: null, nxt: 'L9_t2', lbl2: 'Pierzătoare M10', st: 'wait' },
                'L9': { t1: '', t2: '', s1: null, s2: null, nxt: 'F1_t2', lbl2: 'Pierzătoare M11', st: 'wait' },
                'F1': { t1: '', t2: '', s1: null, s2: null, st: 'wait' }
            };
            localStorage.setItem("cnu16_salvat_v2", JSON.stringify(echipe));
            document.getElementById('setup').style.display = 'none';
            document.getElementById('bracket').style.display = 'block';
            randeazaTablou();
        }
        function randeazaMeci(id, lbl) {
            const m = meciuri[id]; const act = (m.t1 && m.t2 && m.st !== 'done');
            return `<div class="matchup ${act ? 'active' : ''}"><div class="match-title">${lbl}</div>
                <div class="slot"><span>${m.t1 || `<i>${m.lbl1 || 'Așteaptă'}</i>`}</span> ${act ? `<input type="number" id="s1_${id}">` : `<b>${m.s1??''}</b>`}</div>
                <div class="slot"><span>${m.t2 || `<i>${m.lbl2 || 'Așteaptă'}</i>`}</span> ${act ? `<input type="number" id="s2_${id}">` : `<b>${m.s2??''}</b>`}</div>
                ${act ? `<button class="btn-trimite" onclick="salveazaScor('${id}')">Trimite Scor</button>` : ''}</div>`;
        }
        function randeazaTablou() {
            document.getElementById('w-r1').innerHTML = randeazaMeci('W1', 'Meci 1') + randeazaMeci('W2', 'Meci 2') + randeazaMeci('W3', 'Meci 3') + randeazaMeci('W4', 'Meci 4');
            document.getElementById('w-r2').innerHTML = randeazaMeci('W5', 'Meci 5') + randeazaMeci('W6', 'Meci 6') + randeazaMeci('W7', 'Meci 7') + randeazaMeci('W8', 'Meci 8');
            document.getElementById('w-r3').innerHTML = randeazaMeci('W9', 'Meci 13') + randeazaMeci('W10', 'Meci 14');
document.getElementById('w-r4').innerHTML = randeazaMeci('W11', 'Finala Câștigători');
document.getElementById('l-r1').innerHTML = randeazaMeci('L1', 'Meci 9') + randeazaMeci('L2', 'Meci 10');
document.getElementById('l-r2').innerHTML = randeazaMeci('L3', 'Meci 11') + randeazaMeci('L4', 'Meci 12');
document.getElementById('l-r3').innerHTML = randeazaMeci('L5', 'Meci 15') + randeazaMeci('L6', 'Meci 16');
document.getElementById('l-r4').innerHTML = randeazaMeci('L7', 'Meci 17') + randeazaMeci('L8', 'Meci 18');
document.getElementById('l-r5').innerHTML = randeazaMeci('L9', 'Finala Pierzători');
document.getElementById('grand-final').innerHTML = randeazaMeci('F1', 'Marea Finală');
}
function salveazaScor(id) {
const s1 = parseInt(document.getElementById("s1_" + id).value), s2 = parseInt(document.getElementById("s2_" + id).value);
if (isNaN(s1) || isNaN(s2) || s1 === s2) return alert("Scor invalid!");
const m = meciuri[id]; m.s1 = s1; m.s2 = s2; m.st = 'done';
const w = s1 > s2 ? m.t1 : m.t2, l = s1 > s2 ? m.t2 : m.t1;
if (m.nxt) { const [nId, sl] = m.nxt.split(''); meciuri[nId][sl] = w; }
if (m.lsr) { const [lId, sl] = m.lsr.split(''); meciuri[lId][sl] = l; }
randeazaTablou();
}
function reseteazaTot() { localStorage.removeItem("cnu16_salvat_v2"); document.getElementById('bracket').style.display = 'none'; document.getElementById('setup').style.display = 'block'; }
window.onload = function() {
let s = localStorage.getItem("cnu16_salvat_v2");
if (s) { JSON.parse(s).forEach((v, i) => { if(document.getElementById("t" + (i + 1))) document.getElementById("t" + (i + 1)).value = v; }); genereazaTurneu(); }
}
