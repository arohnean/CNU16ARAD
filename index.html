<!DOCTYPE html><html><head><meta charset="utf-8"><title>CN U16 ARAD 2026 FEMININ</title><style>:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#848d97;--accent:#238636}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);text-align:center;margin:10px}.box{background:var(--panel);padding:15px;border-radius:12px;border:1px solid var(--border);margin:20px auto;max-width:1000px}.vertical-stack{display:flex;flex-direction:column;gap:30px;width:100%}.flex-layout{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}.column{display:flex;flex-direction:column;gap:12px;min-width:220px;flex:1}.match{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:left;font-size:13px}input[type="text"],input[type="password"]{background:var(--bg);color:var(--text);padding:6px;border:1px solid var(--border);border-radius:6px;width:90%}input[type="number"]{background:var(--panel);color:var(--text);border:1px solid var(--border);width:35px;text-align:center;font-weight:bold;float:right}.btn{background:var(--accent);color:#fff;padding:10px 20px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}.admin-element{display:none!important}#zona-login{background:var(--panel);border:1px solid var(--border);padding:15px;border-radius:8px;max-width:300px;margin:10px auto;display:none}</style></head><body>
    <h1>CN U16 ARAD 2026 FEMININ</h1>
    <button id="auth-btn" class="btn" style="background:#21262d;border:1px solid var(--border)" onclick="comutaLogin()">🔒 Autentificare Admin</button>
    <button class="btn admin-element" style="background:#30363d;margin-left:10px" onclick="localStorage.clear();location.reload()">🔄 Modifică Echipele</button>
    <div id="zona-login"><input type="password" id="pass" placeholder="Parolă Admin" style="text-align:center;margin-bottom:8px"><br><button class="btn" style="padding:4px 12px" onclick="checkPass()">Verifică</button></div>
    <div id="setup" class="box" style="max-width:480px;display:none"><h3>Configurare Echipe</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="inputs"></div><br><button class="btn" onclick="saveTeams()">Salvează Tabloul</button></div>
    <div id="app" style="padding:5px"><div class="vertical-stack">
        <div class="box"><h2>🌿 RUTA CÂȘTIGĂTORILOR</h2><div class="flex-layout"><div class="column" id="w1"><h4>Turul 1</h4></div><div class="column" id="w2"><h4>Sferturi</h4></div><div class="column" id="w3"><h4>Semifinale</h4></div><div class="column" id="w4"><h4>Finală Ruta W</h4></div></div></div>
        <div class="box"><h2>🍂 RUTA PIERZĂTORILOR</h2><div class="flex-layout"><div class="column" id="l1"><h4>Faza 1</h4></div><div class="column" id="l2"><h4>Faza 2</h4></div><div class="column" id="l3"><h4>Faza 3</h4></div><div class="column" id="l4"><h4>Faza 4</h4></div><div class="column" id="l5"><h4>Finală Ruta L</h4></div></div></div>
    </div><div class="box" style="max-width:280px"><h2>🏆 ETAPA FINALĂ</h2><div id="gf"></div></div></div>
<script>
    if(!localStorage.getItem('cnu16_securizat_v13')){localStorage.clear();sessionStorage.clear();localStorage.setItem('cnu16_securizat_v13','true');location.reload()}
    let adm=(sessionStorage.getItem("cnu16_adm")==="true"),m={},e=["TISEANU / BUGI","BELEJAN / CHERECHES","CARSTEA / VASILESCU","PRESECAN / SABAU","IUGA / PRIPON","ROMAN / CHINDRIS","BLAJ CIOCOIU / SZATMARY","SERTEA / BRENCIU","CRISAN / MORUZ","BALTA / MOTICA","POP / CIMPAN","ILCA / ROSTAS"];
    const container=document.getElementById('inputs');e.forEach((v,i)=>container.innerHTML+=`<input type="text" id="t${i+1}" value="${v}">`);
    function init(){
        const r=(id,t1,t2,n,l,l1,l2)=>m[id]={t1,t2,s1:'',s2:'',n,l,l1,l2,st:''};
        r('M1',e,e,'M5_1','M9_1');r('M2',e,e,'M6_1','M9_2');r('M3',e,e,'M7_1','M10_1');r('M4',e,e,'M8_1','M10_2');
        r('M5','',e,'M13_1','M11_2','Câștigătoare M1');r('M6','',e,'M13_2','M12_2','Câștigătoare M2');r('M7','',e,'M14_1','M15_2','Câștigătoare M3');r('M8','',e,'M14_2','M16_2','Câștigătoare M4');
        r('M13','','','FW_1','M17_2','Câștigătoare M5','Câștigătoare M6');r('M14','','','FW_2','M18_2','Câștigătoare M7','Câștigătoare M8');r('FW','','','MF_1','FL_2','Câștigătoare M13','Câștigătoare M14');
        r('M9','','','M11_1','','Pierzătoare M1','Pierzătoare M2');r('M10','','','M12_1','','Pierzătoare M3','Pierzătoare M4');
        r('M11','','','M15_1','','Câștigătoare M9','Pierzătoare M5');r('M12','','','M16_1','','Câștigătoare M10','Pierzătoare M6');
        r('M15','','','M17_1','','Câștigătoare M11','Pierzătoare M7');r('Mext','','','M18_1','','Câștigătoare M12','Pierzătoare M8');
        r('M17','','','FL_1','','Câștigătoare M15','Pierzătoare M9');r('M18','','','FL_2_alt','','Câștigătoare Mext','Pierzătoare M10');
        r('FL','','','MF_2','','Câștigătoare M17','Pierzătoare M13');r('MF','','','','','Câștigătoare Winners','Câștigătoare Losers');
    }
    function render(){
        const h=(id,lbl)=>{const x=m[id];const act=(x.t1&&x.t2&&x.st!=='done');
        return `<div class="match"><b>${lbl}</b><div style="margin:4px 0"><span>${x.t1||`<i>${x.l1||'Așteaptă'}</i>`}</span>${act?`<input type="number" id="s1_${id}" ${adm?'':'disabled'} value="${x.s1}">`:`<b>${x.s1}</b>`}</div><div><span>${x.t2||`<i>${x.l2||'Așteaptă'}</i>`}</span>${act?`<input type="number" id="s2_${id}" ${adm?'':'disabled'} value="${x.s2}">`:`<b>${x.s2}</b>`}</div>${act&&adm?`<button class="btn" style="padding:2px 8px;margin-top:6px;font-size:11px" onclick="save('${id}')">Trimite</button>`:''}</div>`};
        document.getElementById('w1').innerHTML=h('M1','Meci 1')+h('M2','Meci 2')+h('M3','Meci 3')+h('M4','Meci 4');
        document.getElementById('w2').innerHTML=h('M5','Meci 5')+h('M6','Meci 6')+h('M7','Meci 7')+h('M8','Meci 8');
        document.getElementById('w3').innerHTML=h('M13','Meci 13')+h('M14','Meci 14');document.getElementById('w4').innerHTML=h('FW','Finala W');
        document.getElementById('l1').innerHTML=h('M9','Meci 9')+h('M10','Meci 10');document.getElementById('l2').innerHTML=h('M11','Meci 11')+h('M12','Meci 12');
        document.getElementById('l3').innerHTML=h('M15','Meci 15')+h('Mext','Meci 16');document.getElementById('l4').innerHTML=h('M17','Meci 17')+h('M18','Meci 18');
        document.getElementById('l5').innerHTML=h('FL','Finala L');document.getElementById('gf').innerHTML=h('MF','Marea Finală');
        document.querySelectorAll('.admin-element').forEach(el=>el.style.setProperty('display',adm?'inline-block':'none','important'));
        document.getElementById("auth-btn").textContent=adm?"🔓 Admin Activ (Blochează)":"🔒 Autentificare Admin";
    }
    function comutaLogin(){if(adm){adm=false;sessionStorage.removeItem("cnu16_adm");location.reload()}else{const zl=document.getElementById("zona-login");zl.style.display=(zl.style.display==="block")?"none":"block"}}
    function checkPass(){if(document.getElementById("pass").value==="brizo2026"){adm=true;sessionStorage.setItem("cnu16_adm","true");document.getElementById("zona-login").style.display="none";render()}else{alert("Greșit!")}}
    function save(id){
        const s1=parseInt(document.getElementById('s1_'+id).value),s2=parseInt(document.getElementById('s2_'+id).value);if(isNaN(s1)||isNaN(s2)||s1===s2)return alert("Scor invalid!");
        const x=m[id];x.s1=s1;x.s2=s2;x.st='done';const w=s1>s2?x.t1:x.t2,l=s1>s2?x.t2:x.t1;
        if(x.n){const[nId,p]=x.n.split('_');if(p==='1')m[nId].t1=w;else m[nId].t2=w}
        if(x.l){const[lId,p]=x.l.split('_');if(lId==='FL'&&id==='M18')m[lId].t2=l;else if(p==='1')m[lId].t1=l;else m[lId].t2=l}
        localStorage.setItem('cnu16_m_v13',JSON.stringify(m));render();
    }
    function saveTeams(){let n=[];for(let i=1;i<=12;i++)n.push(document.getElementById('t'+i).value);localStorage.setItem('cnu16_e_v13',JSON.stringify(n));location.reload()}
    let se=localStorage.getItem('cnu16_e_v13'),sm=localStorage.getItem('cnu16_m_v13');if(se){JSON.parse(se).forEach((v,i)=>e[i]=v)}init();if(sm){m=JSON.parse(sm)}render();
</script></body></html>
