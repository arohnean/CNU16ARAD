<!DOCTYPE html><html><head><meta charset="utf-8"><title>CN U16 ARAD</title><style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--accent:#238636}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);margin:10px;text-align:center}
.box{background:var(--panel);padding:15px;border-radius:12px;border:1px solid var(--border);margin:15px auto;max-width:980px}
.flex{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px;min-width:210px;flex:1}
.match{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:left;font-size:13px;margin:5px 0}
input[type="password"]{background:var(--bg);color:var(--text);padding:6px;border:1px solid var(--border);border-radius:6px;width:120px;text-align:center}
input[type="number"]{background:var(--panel);color:var(--text);border:1px solid var(--border);width:35px;text-align:center;font-weight:bold;float:right}
.btn{background:var(--accent);color:#fff;padding:6px 12px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
</style></head><body>
    <h1>CN U16 ARAD 2026 FEMININ</h1>
    <div class="box" style="max-width:380px">
        <input type="password" id="pass" placeholder="Parolă Admin">
        <button class="btn" onclick="login()">Login</button>
        <button class="btn" id="b-lock" style="background:#30363d;display:none" onclick="logout()">Blochează</button>
    </div>
    <div class="box"><h2>🌿 RUTA CÂȘTIGĂTORILOR</h2><div class="flex"><div class="col" id="w1"><h4>Turul 1</h4></div><div class="col" id="w2"><h4>Sferturi</h4></div><div class="col" id="w3"><h4>Semifinale</h4></div><div class="col" id="w4"><h4>Finală Ruta W</h4></div></div></div>
    <div class="box"><h2>🍂 RUTA PIERZĂTORILOR</h2><div class="flex"><div class="col" id="l1"><h4>Faza 1</h4></div><div class="col" id="l2"><h4>Faza 2</h4></div><div class="column col" id="l3"><h4>Faza 3</h4></div><div class="col" id="l4"><h4>Faza 4</h4></div><div class="col" id="l5"><h4>Finală Ruta L</h4></div></div></div>
    <div class="box" style="max-width:280px"><h2>🏆 ETAPA FINALĂ</h2><div id="gf"></div></div>
<script>
    const eq=["TISEANU / BUGI","BELEJAN / CHERECHES","CARSTEA / VASILESCU","PRESECAN / SABAU","IUGA / PRIPON","ROMAN / CHINDRIS","BLAJ CIOCOIU / SZATMARY","SERTEA / BRENCIU","CRISAN / MORUZ","BALTA / MOTICA","POP / CIMPAN","ILCA / ROSTAS"];
    let adm=(sessionStorage.getItem("is_adm")==="1"),m={};
    function init(){
        const r=(id,t1,t2,n,l,l1,l2)=>m[id]=m[id]||{t1,t2,s1:'',s2:'',n,l,l1,l2,st:''};
        r('M1',eq[4],eq[11],'M5_1','M9_1');r('M2',eq[7],eq[8],'M6_1','M9_2');r('M3',eq[5],eq[10],'M7_1','M10_1');r('M4',eq[6],eq[9],'M8_1','M10_2');
        r('M5','',eq[0],'M13_1','M11_2','Câștigătoare M1');r('M6','',eq[3],'M13_2','M12_2','Câștigătoare M2');r('M7','',eq[1],'M14_1','M15_2','Câștigătoare M3');r('M8','',eq[2],'M14_2','M16_2','Câștigătoare M4');
        r('M13','','','FW_1','M17_2','Câștigătoare M5','Câștigătoare M6');r('M14','','','FW_2','M18_2','Câștigătoare M7','Câștigătoare M8');r('FW','','','MF_1','FL_2','Câștigătoare M13','Câștigătoare M14');
        r('M9','','','M11_1','','Pierzătoare M1','Pierzătoare M2');r('M10','','','M12_1','','Pierzătoare M3','Pierzătoare M4');
        r('M11','','','M15_1','','Câștigătoare M9','Pierzătoare M5');r('M12','','','M16_1','','Câștigătoare M10','Pierzătoare M6');
        r('M15','','','M17_1','','Câștigătoare M11','Pierzătoare M7');r('M16','','','M18_1','','Câștigătoare M12','Pierzătoare M8');
        r('M17','','','FL_1','','Câștigătoare M15','Pierzătoare M9');r('M18','','','FL_2','','Câștigătoare M16','Pierzătoare M10');
        r('FL','','','MF_2','','Câștigătoare M17','Pierzătoare M13');r('MF','','','','','Câștigătoare Winners','Câștigătoare Losers');
    }
    function render(){
        const h=(id,lbl)=>{const x=m[id];const act=(x.t1&&x.t2&&x.st!=='done');
        return `<div class="match"><b>${lbl}</b><div style="margin:4px 0"><span>${x.t1||`<i>${x.l1||'Așteaptă'}</i>`}</span>${act?`<input type="number" id="s1_${id}" ${adm?'':'disabled'} value="${x.s1}">`:`<b>${x.s1}</b>`}</div><div><span>${x.t2||`<i>${x.l2||'Așteaptă'}</i>`}</span>${act?`<input type="number" id="s2_${id}" ${adm?'':'disabled'} value="${x.s2}">`:`<b>${x.s2}</b>`}</div>${act&&adm?`<button class="btn" style="padding:2px 6px;margin-top:5px;font-size:11px" onclick="save('${id}')">Trimite</button>`:''}</div>`};
        document.getElementById('w1').innerHTML='<h4>Turul 1</h4>'+h('M1','Meci 1')+h('M2','Meci 2')+h('M3','Meci 3')+h('M4','Meci 4');
        document.getElementById('w2').innerHTML='<h4>Sferturi</h4>'+h('M5','Meci 5')+h('M6','Meci 6')+h('M7','Meci 7')+h('M8','Meci 8');
        document.getElementById('w3').innerHTML='<h4>Semifinale</h4>'+h('M13','Meci 13')+h('M14','Meci 14');document.getElementById('w4').innerHTML='<h4>Finală</h4>'+h('FW','Finala W');
        document.getElementById('l1').innerHTML='<h4>Faza 1</h4>'+h('M9','Meci 9')+h('M10','Meci 10');document.getElementById('l2').innerHTML='<h4>Faza 2</h4>'+h('M11','Meci 11')+h('M12','Meci 12');
        document.getElementById('l3').innerHTML='<h4>Faza 3</h4>'+h('M15','Meci 15')+h('M16','Meci 16');document.getElementById('l4').innerHTML='<h4>Faza 4</h4>'+h('M17','Meci 17')+h('M18','Meci 18');
        document.getElementById('l5').innerHTML='<h4>Finală L</h4>'+h('FL','Finala L');document.getElementById('gf').innerHTML=h('MF','Marea Finală');
        document.getElementById('b-lock').style.display=adm?'inline-block':'none';
    }
    function save(id){
        const s1=parseInt(document.getElementById('s1_'+id).value),s2=parseInt(document.getElementById('s2_'+id).value);if(isNaN(s1)||isNaN(s2)||s1===s2)return alert("Scor invalid!");
        const x=m[id];x.s1=s1;x.s2=s2;x.st='done';const w=s1>s2?x.t1:x.t2,l=s1>s2?x.t2:x.t1;
        if(x.n){const[nId,p]=x.n.split('_');if(p==='1')m[nId].t1=w;else m[nId].t2=w}
        if(x.l){const[lId,p]=x.l.split('_');if(lId==='FL'&&id==='M18')m[lId].t2=l;else if(p==='1')m[lId].t1=l;else m[lId].t2=l}
        localStorage.setItem('cnu16_stoc_final',JSON.stringify(m));render();
    }
    function login(){if(document.getElementById("pass").value==="brizo2026"){adm=true;sessionStorage.setItem("is_adm","1");render()}else{alert("Greșit!")}}
    function logout(){adm=false;sessionStorage.removeItem("is_adm");location.reload()}
    let sm=localStorage.getItem('cnu16_stoc_final');init();if(sm){m=JSON.parse(sm)}render();
</script></body></html>
